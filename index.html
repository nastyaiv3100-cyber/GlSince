function updateNav(){$('nav').innerHTML=titles.map((t,i)=>`<button data-num="${i+1}" class="${i===state.page?'active ':''}${state.done[i]?'done':''}" ${i===state.page?'aria-current="step"':''} onclick="go(${i})">${String(i+1).padStart(2,'0')} · ${t}${state.done[i]?'<span class="small" aria-label="выполнено"></span>':''}</button>`).join('');let n=Object.keys(state.done).filter(k=>state.done[k]&&+k<9).length;$('progress').value=n;$('progressText').textContent=`Пройдено ${n} из 9 этапов`}
function go(p){stroke=null;state.page=p;render();window.scrollTo({top:0,behavior:'instant'})}
function check(){let p=state.page,a=ans(),ok=false,hint='';if(p>=2&&p<=5){let key={2:[1],3:[2],4:[1,2],5:[0,3,4]}[p];let count=p===5?5:4;ok=Array.from({length:count},(_,i)=>!!a[i]===key.includes(i)).every(Boolean);hint={2:'Задай вопрос «кто собирает орехи?».',3:'Ветер что делает? Найди действие.',4:'Что устилает дорожку? Листья что делают?',5:'Основа — «ребята собрали». Остальные слова поясняют её.'}[p]}else{const key=p===6?{a:'0',b:'1',c:'2'}:{0:'2',1:'0',2:'2',3:'1'};ok=Object.entries(key).every(([k,v])=>a[k]===v);hint=p===6?'Спроси о признаке белки, способе действия и о том, что она прячет.':'Что? Дождь. Дождь что делает? Стучит. Какие слова добавляют подробности?'}state.checks[p]={ok,text:ok?'Верно! Ты справился(ась). Можно идти дальше.':'Пока не всё верно. '+hint+' Измени ответ и проверь ещё раз.'};state.done[p]=ok;tone(ok);render()}
function retry(){state.answers[state.page]={};delete state.done[state.page];delete state.checks[state.page];render()}
function sample(){state.samples[8]=!state.samples[8];render()}
function completeOpen(){if(!(ans().text||'').trim()){$('feedback').textContent='Сначала запиши свой ответ.';return}if(!state.samples[8]){state.samples[8]=true;render();$('feedback').textContent='Сравни свой ответ с образцом, затем отметь самопроверку.';return}state.done[8]=true;tone(true);render()}
function resizeCanvas(){const r=$('workspace').getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);paint()}
function paint(){let w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);for(const s of state.drawings[state.page]||[]){ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=s.width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();s.points.forEach((p,i)=>{i?ctx.lineTo(p[0]*w,p[1]*h):ctx.moveTo(p[0]*w,p[1]*h)});if(s.points.length===1){let p=s.points[0];ctx.arc(p[0]*w,p[1]*h,s.width/2,0,Math.PI*2);ctx.fill()}else ctx.stroke()}ctx.globalCompositeOperation='source-over'}
function point(e){let r=canvas.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
canvas.onpointerdown=e=>{if(!drawing)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);stroke={erase,color:$('color').value,width:erase?+ $('width').value*4:+$('width').value,points:[point(e)]};(state.drawings[state.page]??=[]).push(stroke);paint()};canvas.onpointermove=e=>{if(stroke){stroke.points.push(point(e));paint()}};canvas.onpointerup=canvas.onpointercancel=()=>{stroke=null;save()};
function drawUI(){canvas.classList.toggle('enabled',drawing);$('pen').textContent='Карандаш: '+(drawing?'вкл.':'выкл.');$('pen').setAttribute('aria-pressed',drawing);$('pen').classList.toggle('selected',drawing&&!erase);$('eraser').classList.toggle('selected',drawing&&erase);$('eraser').setAttribute('aria-pressed',drawing&&erase);$('drawNote').textContent=drawing?'Чтобы отвечать, выключи карандаш.':''}
$('pen').onclick=()=>{drawing=!drawing;erase=false;drawUI()};$('eraser').onclick=()=>{erase=!erase;drawing=true;drawUI()};$('clear').onclick=()=>{state.drawings[state.page]=[];paint();save()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent='Звук: '+(sound?'включён':'выключен');$('sound').setAttribute('aria-pressed',sound);tone(true)};$('back').onclick=()=>go(Math.max(0,state.page-1));$('next').onclick=()=>{if(state.page<2)state.done[state.page]=true;go(Math.min(titles.length-1,state.page+1))};$('reset').onclick=()=>$('resetDialog').showModal();$('cancelReset').onclick=()=>$('resetDialog').close();$('confirmReset').onclick=()=>{state=fresh();drawing=false;erase=false;stroke=null;drawUI();$('resetDialog').close();render()};function blockRender(b){return head(`Практика ${state.page-1} / ${blocks.length}`,b.title,b.desc)+b.items.map((q,i)=>{let key='q'+i,v=ans()[key];let content='';if(b.type==='words')content=`<div class="sentence">${q.text.split(' ').map((word,j)=>`<button class="word ${(v||[]).includes(j)?'chosen':''}" aria-pressed="${(v||[]).includes(j)}" onclick="multi(${i},${j})">${word}</button>`).join('')}.</div>`;if(b.type==='choice')content=select(key,q.text,q.options);if(b.type==='text')content=`<p>${q.text}</p><label class="small" for="${key}">Грамматическая основа</label><input style="width:100%" id="${key}" type="text" value="${esc(v)}" oninput="input('${key}',this.value)" placeholder="Подлежащее сказуемое">`;if(b.type==='open')content=`<label for="${key}">${q.text}</label><textarea id="${key}" oninput="input('${key}',this.value)" placeholder="Запиши свой ответ…">${esc(v)}</textarea><button onclick="showSample(${i})">${state.samples[state.page+'_'+i]?'Скрыть образец':'Показать образец'}</button>${state.samples[state.page+'_'+i]?`<div class="sample">${q.sample}</div>`:''}`;let r=state.checks[state.page]?.results?.[i];return `<section class="box"><div class="eyebrow">Задание ${i+1}</div>${content}${r===undefined?'':`<div class="feedback ${r?'good':''}">${r?'Верно!':'Проверь ещё раз. '+q.hint}</div>`}</section>`}).join('')+(b.type==='open'?`<p class="small">Проверь: все пункты выполнены, основы найдены, вопросы подходят. Образец не обязан совпадать с твоим ответом.</p><button class="primary" onclick="finishOpen()">Все ответы проверены по образцам</button><div class="feedback" id="feedback" role="status">${state.done[state.page]?'Самопроверка выполнена.':''}</div>`:controls())}
function multi(i,j){let a=[...(ans()['q'+i]||[])];a=a.includes(j)?a.filter(x=>x!==j):[...a,j];input('q'+i,a);render()}
function showSample(i){let k=state.page+'_'+i;state.samples[k]=!state.samples[k];render()}
function finishOpen(){let b=blocks[state.page-2];if(!b.items.every((_,i)=>(ans()['q'+i]||'').trim())){$('feedback').textContent='Сначала выполни все задания на этом экране.';return}if(!b.items.every((_,i)=>state.samples[state.page+'_'+i])){$('feedback').textContent='Открой каждый образец и сравни со своим ответом.';return}state.done[state.page]=true;save();tone(true);render()}
function normalize(s){return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[.,!?;:«»"—–]/g,' ').trim().replace(/\s+/g,' ')}
function check(){let b=blocks[state.page-2];if(!b||b.type==='open')return;let results=b.items.map((q,i)=>{let a=ans()['q'+i];if(b.type==='words')return Array.isArray(a)&&a.length===q.key.length&&q.key.every(k=>a.includes(k));if(b.type==='text')return normalize(a)===normalize(q.key);return String(a)===String(q.key)});let n=results.filter(Boolean).length;state.checks[state.page]={ok:n===results.length,results,text:n===results.length?'Все ответы верны!':`Верно ${n} из ${results.length}. Исправь отмеченные задания и проверь снова.`};state.done[state.page]=n===results.length;tone(state.done[state.page]);render()}
function updateNav(){$('nav').innerHTML=titles.map((t,i)=>`<button data-num="${i+1}" class="${i===state.page?'active ':''}${state.done[i]?'done':''}" ${i===state.page?'aria-current="step"':''} onclick="go(${i})">${String(i+1).padStart(2,'0')} · ${t}</button>`).join('');let n=Object.keys(state.done).filter(k=>state.done[k]&&+k<titles.length-1).length;$('progress').max=titles.length-1;$('progress').value=n;$('progressText').textContent=`Пройдено ${n} из ${titles.length-1} этапов`}
function render(){let p=state.page;if(p<2)legacyRender();else if(p<titles.length-1)$('page').innerHTML=blockRender(blocks[p-2]);else{let count=0,total=0,open=0;blocks.forEach((b,i)=>{if(b.type==='open'){if(state.done[i+2])open+=b.items.length}else{total+=b.items.length;count+=(state.checks[i+2]?.results||[]).filter(Boolean).length}});$('page').innerHTML=`<div class="hero"><div class="intro"><div class="eyebrow">Финишная поляна</div><h1>${count===total&&open===8?'Квест пройден!':'Твои результаты'}</h1><div class="score">${count} / ${total}</div><p>заданий с автопроверкой решено верно.</p><div class="box">Творческие задания: ${open} из 8 прошли самопроверку.</div><p>Можно вернуться к любому этапу и продолжить. Старайся объяснять каждый ответ вопросами к словам.</p><span class="chip">Урок на Play · Орлова А. Р.</span></div><img src="${images[2]}" alt="Герои с золотым листом"></div>`}updateNav();$('back').disabled=p===0;$('next').disabled=p===titles.length-1;$('pageNumber').textContent=`Экран ${p+1} из ${titles.length}`;requestAnimationFrame(resizeCanvas);save()}

new ResizeObserver(resizeCanvas).observe($('workspace'));render();
</script></body></html>
